name: localai-isnot-cheap

services:
  postgres:
    image: postgres:16-alpine
    container_name: lfm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-lago_production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lfm-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lfm-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: lfm-llama-cpp
    profiles: ["llama-cpp"]
    runtime: nvidia
    command:
      - "-m"
      - "/models/LFM2.5-2.6B-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  vllm:
    image: vllm/vllm-openai:latest
    container_name: lfm-vllm
    profiles: ["vllm"]
    runtime: nvidia
    command:
      - "--model"
      - "LiquidAI/LFM2.5-2.6B"
      - "--served-model-name"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sglang:
    image: lmsysorg/sglang:latest
    container_name: lfm-sglang
    profiles: ["sglang"]
    runtime: nvidia
    command:
      - "python3"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "30000:30000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  lago-api:
    image: getlago/api:latest
    container_name: lfm-lago-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/lago_production
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-in-prod}
      LAGO_DISABLE_SIGNUP: "false"
      API_PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lago-worker:
    image: getlago/api:latest
    container_name: lfm-lago-worker
    command: ["bundle", "exec", "sidekiq"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/lago_production
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lago-web:
    image: getlago/front:v1
    container_name: lfm-lago-web
    environment:
      API_URL: http://lago-api:3000
      APP_GRAPHQL_URL: http://lago-api:3000/graphql
    ports:
      - "8085:80"
    depends_on:
      - lago-api

volumes:
  postgres-data:
  redis-data:
