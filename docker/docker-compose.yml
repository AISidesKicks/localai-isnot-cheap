name: cheap-lab

services:
  cheap-postgres:
    image: postgres:16-alpine
    container_name: cheap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cheap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secred_pwd}
      POSTGRES_DB: ${POSTGRES_LITELLM_DB:-litellm_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_LITELLM_DB:-litellm_db},${POSTGRES_PHOENIX_DATABASE:-phoenix_db}
    volumes:
      - cheap-postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cheap} -d ${POSTGRES_LITELLM_DB:-litellm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cheap-net

  cheap-redis:
    image: redis:7-alpine
    container_name: cheap-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cheap-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cheap-net

  cheap-litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cheap-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234-master-key-4321}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheap}:${POSTGRES_PASSWORD:-secred_pwd}@cheap-postgres:5432/${POSTGRES_LITELLM_DB:-litellm_db}
      REDIS_HOST: cheap-redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cheap-phoenix:6006/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: cheap-litellm
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "4000:4000"
    depends_on:
      cheap-postgres:
        condition: service_healthy
      cheap-redis:
        condition: service_healthy
      cheap-phoenix:
        condition: service_healthy
      cheap-llamacpp:
        condition: service_healthy
        required: false
      cheap-vllm:
        condition: service_healthy
        required: false
      cheap-sglang:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cheap-net

  cheap-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: cheap-llamacpp
    profiles: ["llamacpp"]
    runtime: nvidia
    command:
      - "-m"
      - "/models/Q8/LFM2.5-2.6B-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
      - "--reasoning"
      - "on"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-preserve"
      - "--metrics"
      - "--ctx-size"
      - "128000"
      - "--parallel"
      - "4"
      - "--no-kv-unified"
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cheap-net

  cheap-vllm:
    image: vllm/vllm-openai:latest
    container_name: cheap-vllm
    profiles: ["vllm"]
    runtime: nvidia
    command:
      - "--model"
      - "plavno/LFM2.5-2.6B-AutoRound-W8A16"
      - "--served-model-name"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reasoning-parser"
      - "olmo3"
      - "--max-model-len"
      - "128000"
      - "--max-num-seqs"
      - "4"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 420s
    networks:
      - cheap-net

  cheap-sglang:
    image: lmsysorg/sglang:latest
    container_name: cheap-sglang
    profiles: ["sglang"]
    runtime: nvidia
    command:
      - "python3"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "plavno/LFM2.5-2.6B-AutoRound-W8A16"
      - "--served-model-name"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--reasoning-parser"
      - "deepseek-r1"
      - "--enable-metrics"
      - "--context-length"
      - "128000"
      - "--max-running-requests"
      - "4"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "30000:30000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 420s
    networks:
      - cheap-net

  cheap-phoenix:
    image: arizephoenix/phoenix:latest   # document: >= 19.0 for /mcp
    container_name: cheap-phoenix
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-cheap}:${POSTGRES_PASSWORD:-secred_pwd}@cheap-postgres:5432/${POSTGRES_PHOENIX_DATABASE:-phoenix_db}
      PHOENIX_ENABLE_MCP_SERVER: "true"   # default true; kept explicit
      PHOENIX_ENABLE_MCP_CODE_MODE: "true" # default true; agents can run sandboxed code
    ports:
      - "6006:6006"   # UI + OTLP HTTP (/v1/traces) + MCP (/mcp)
      - "4317:4317"   # OTLP gRPC
    depends_on:
      cheap-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/v1/health')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cheap-net

  cheap-victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: cheap-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1M"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - cheap-vmdata:/victoria-metrics-data
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8428:8428"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - cheap-net

  vm-mcp:
    image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
    container_name: vm-mcp
    environment:
      MCP_SERVER_MODE: http
      MCP_LISTEN_ADDR: :8000
      VM_INSTANCE_ENTRYPOINT: http://cheap-victoriametrics:8428
      VM_INSTANCE_TYPE: single
      MCP_DISABLED_TOOLS: "export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,documentation"
    ports:
      - "8000:8000"
    depends_on:
      cheap-victoriametrics:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - cheap-net

  litellm-mcp:
    image: ghcr.io/tetra-2023/litellm-mcp:latest
    container_name: litellm-mcp
    entrypoint: ["/app/.venv/bin/python", "/app/litellm_mcp_entrypoint.py"]  # FastMCP defaults to 127.0.0.1; wrapper forces 0.0.0.0
    volumes:
      - ./litellm_mcp_entrypoint.py:/app/litellm_mcp_entrypoint.py:ro
    environment:
      LITELLM_PROXY_URL: http://cheap-litellm:4000
      LITELLM_API_KEY: ${LITELLM_ADMIN_KEY:-${LITELLM_MASTER_KEY:-sk-1234-master-key-4321}}
      LITELLM_TRANSPORT: streamable-http   # must override docker default stdio
    ports:
      - "4001:8000"   # admin MCP; FastMCP streamable-http serves on /mcp
    depends_on:
      cheap-litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - cheap-net

networks:
  cheap-net:
    name: cheap-net

volumes:
  cheap-postgres-data:
    name: cheap-postgres-data
  cheap-redis-data:
    name: cheap-redis-data
  cheap-vmdata:
    name: cheap-vmdata
