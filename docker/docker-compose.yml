name: cheap-lab

services:
  cheap-postgres:
    image: postgres:16-alpine
    container_name: cheap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cheap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secred_pwd}
      POSTGRES_DB: ${POSTGRES_LITELLM_DB:-litellm_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_LAGO_DATABASE:-lago_db}
    volumes:
      - cheap-postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cheap} -d ${POSTGRES_LITELLM_DB:-litellm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cheap-net

  cheap-redis:
    image: redis:7-alpine
    container_name: cheap-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cheap-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cheap-net

  cheap-litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cheap-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234-master-key-4321}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheap}:${POSTGRES_PASSWORD:-secred_pwd}@cheap-postgres:5432/${POSTGRES_LITELLM_DB:-litellm_db}
      REDIS_HOST: cheap-redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "4000:4000"
    depends_on:
      cheap-postgres:
        condition: service_healthy
      cheap-redis:
        condition: service_healthy
      cheap-llamacpp:
        condition: service_healthy
        required: false
      cheap-vllm:
        condition: service_healthy
        required: false
      cheap-sglang:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cheap-net

  cheap-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: cheap-llamacpp
    profiles: ["llamacpp"]
    runtime: nvidia
    command:
      - "-m"
      - "/models/Q8/LFM2.5-2.6B-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cheap-net

  cheap-vllm:
    image: vllm/vllm-openai:latest
    container_name: cheap-vllm
    profiles: ["vllm"]
    runtime: nvidia
    command:
      - "--model"
      - "plavno/LFM2.5-2.6B-AutoRound-W8A16"
      - "--served-model-name"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 420s
    networks:
      - cheap-net

  cheap-sglang:
    image: lmsysorg/sglang:latest
    container_name: cheap-sglang
    profiles: ["sglang"]
    runtime: nvidia
    command:
      - "python3"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "plavno/LFM2.5-2.6B-AutoRound-W8A16"
      - "--served-model-name"
      - "LiquidAI/LFM2.5-2.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./models/hf-cache}:/root/.cache/huggingface
    ports:
      - "30000:30000"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 420s
    networks:
      - cheap-net

  cheap-lago-api:
    image: getlago/api:latest
    container_name: cheap-lago-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheap}:${POSTGRES_PASSWORD:-secred_pwd}@cheap-postgres:5432/${POSTGRES_LAGO_DATABASE:-lago_db}
      REDIS_URL: redis://cheap-redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-in-prod}
      LAGO_DISABLE_SIGNUP: "false"
      API_PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      cheap-postgres:
        condition: service_healthy
      cheap-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cheap-net

  cheap-lago-worker:
    image: getlago/api:latest
    container_name: cheap-lago-worker
    command: ["bundle", "exec", "sidekiq"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cheap}:${POSTGRES_PASSWORD:-secred_pwd}@cheap-postgres:5432/${POSTGRES_LAGO_DATABASE:-lago_db}
      REDIS_URL: redis://cheap-redis:6379/0
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-change-me-in-prod}
    depends_on:
      cheap-postgres:
        condition: service_healthy
      cheap-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cheap-net

  cheap-lago-web:
    image: getlago/front:v1
    container_name: cheap-lago-web
    environment:
      API_URL: http://cheap-lago-api:3000
      APP_GRAPHQL_URL: http://cheap-lago-api:3000/graphql
    ports:
      - "8085:80"
    depends_on:
      cheap-lago-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cheap-net

networks:
  cheap-net:
    name: cheap-net

volumes:
  cheap-postgres-data:
    name: cheap-postgres-data
  cheap-redis-data:
    name: cheap-redis-data
