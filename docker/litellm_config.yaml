model_list:
  - model_name: local-gguf
    litellm_params:
      model: openai/LiquidAI/LFM2.5-2.6B
      api_base: http://cheap-llamacpp:8080/v1
      api_key: dummy

  - model_name: local-llama
    litellm_params:
      model: openai/LiquidAI/LFM2.5-2.6B
      api_base: http://cheap-vllm:8000/v1
      api_key: dummy

  - model_name: local-sglang
    litellm_params:
      model: openai/LiquidAI/LFM2.5-2.6B
      api_base: http://cheap-sglang:30000/v1
      api_key: dummy

  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ["OPENAI_API_KEY"]

  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ["ANTHROPIC_API_KEY"]

  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ["DEEPSEEK_API_KEY"]

litellm_settings:
  drop_params: true
  set_verbose: true
  callbacks: ["otel"]
  otel: true
  cache: true
  cache_params:
    type: redis
    host: cheap-redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10

mcp_servers:
  phoenix:
    url: "http://cheap-phoenix:6006/mcp"
    transport: "http"
    allow_all_keys: true
  victoriametrics:
    url: "http://vm-mcp:8000/mcp"
    transport: "http"
    allow_all_keys: true
  litellm_admin:
    url: "http://litellm-mcp:8000/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/LITELLM_MASTER_KEY
