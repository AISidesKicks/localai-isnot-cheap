global:
  scrape_interval: 10s
scrape_configs:
  - job_name: 'llm-inference-engines'
    static_configs:
      - targets: ['cheap-vllm:8000']
        labels:
          engine_type: 'vllm'
      - targets: ['cheap-sglang:30000']
        labels:
          engine_type: 'sglang'
      - targets: ['cheap-llamasrv:8080']
        labels:
          engine_type: 'llamasrv'
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['cheap-redis-exporter:9121']
        labels:
          db_type: 'redis'
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['cheap-postgres-exporter:9187']
        labels:
          db_type: 'postgres'
