[workspace]
authors = ["HOT AIcoder <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge", "main", "r", "msys2"]
name = "cheap"
platforms = ["linux-64"]
version = "0.1.0"

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"

[tasks]
default = "mkdir -p /run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
cinematic-01-generate = "python smoketests/cinematic-01/generate.py"
cinematic-01-test = "python smoketests/cinematic-01/test.py"
cinematic-01-report = "python smoketests/cinematic-01/report.py"
toolcalling-01-test = "python smoketests/toolcalling-01/test.py"
toolcalling-01-report = "python smoketests/toolcalling-01/report.py"

[dependencies]
python = "3.12.*"
pip = "*"
ruff = ">=0.16.4,<0.17"

[pypi-dependencies]
litellm = "*"
openai = "*"
python-dotenv = "*"
pydantic = ">=2.0"
deepeval = "*"
promptfoo = "*"
ragas = "*"
trulens = "*"
trulens-providers-litellm = "*"
trulens-providers-openai = "*"
promptrefiner = "*"
promptimal = "*"
pandas = "*"
tenacity = "*"
matplotlib = "*"
seaborn = "*"
datasets = "*"
rapidfuzz = "*"
pytest = "*"
httpx = "*"
httpx-sse = "*"
asyncio = "*"
anyio = "*"
diskcache = "*"
microsandbox = ">=0.6.14, <0.7"
